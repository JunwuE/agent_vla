[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vla-agent"
version = "0.1.0"
description = "Supervised pi0.5 execution, bounded recovery, and correction data collection"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "jsonschema>=4.20,<5", "pillow>=10", "httpx>=0.27,<1", "pydantic>=2.10,<3", "PyYAML>=6", "msgpack>=1", "websockets>=14,<16"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
vla-agent = "vla_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
