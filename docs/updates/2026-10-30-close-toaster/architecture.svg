    <path d="M500 898 V922 M495 917 L500 922 L505 917" fill="none" stroke="#71869a" stroke-width="2"/>
    <rect x="220" y="924" width="560" height="65" rx="12" fill="#eef3f8" stroke="#b5c6d6"/>
    <text x="500" y="950" font-size="21" fill="#14283f">Environment Adapter</text>
    <text x="500" y="975" font-size="17" fill="#536779">独立进程 RPC · 观测 / 动作转换</text>
    <path d="M500 989 V1013 M495 1008 L500 1013 L505 1008" fill="none" stroke="#71869a" stroke-width="2"/>
    <rect x="220" y="1015" width="560" height="65" rx="12" fill="#eef3f8" stroke="#b5c6d6"/>
    <text x="500" y="1041" font-size="21" fill="#14283f">RoboCasa365 · 原生完成验证</text>
    <text x="500" y="1066" font-size="17" fill="#536779">新观测供执行、审核及程序检查使用</text>
    <path d="M500 1080 V1104 M495 1099 L500 1104 L505 1099" fill="none" stroke="#8aa7d8" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="140" y="1106" width="720" height="65" rx="12" fill="#f3effa" stroke="#b7a2d2"/>
    <text x="500" y="1132" font-size="21" fill="#5b3d80">Recorder → Episodic Memory / 候选技能</text>
    <text x="500" y="1157" font-size="17" fill="#5b3d80">保存事实、假设与独立结果 · 复测后才晋级技能</text>
    <text x="500" y="1202" font-size="16" fill="#536779">当前开发配置 · 反馈回路用文字标注，避免跨层连线</text>
  </g>
</svg>
