    <text x="735" y="450" font-size="20" fill="#173e78">Astra 审核 + 按需工具</text>
    <text x="735" y="473" font-size="16" fill="#536779">Flora · 轨迹 · 几何 · Memory</text>
    <text x="735" y="515" font-size="16" fill="#536779">审核期间 VLA 继续；无问题则继续</text>
